# Eclipse Pro — Windows exe builder (GitHub Actions)
#
# Kaise use karein:
# 1. Is file ko repo me .github/workflows/build-windows.yml path par add karo
#    (GitHub website -> Add file -> Create new file -> naam me poora path likho)
# 2. Actions tab -> "Build Eclipse Pro (Windows exe)" -> Run workflow dabao
# 3. Build khatam hone par neeche "Artifacts" me EclipsePro-windows download karo
#
# NOTE (v1): Pehli build me fail hona normal hai — log bhej dena, fix kar dunga.

name: Build Eclipse Pro (Windows exe)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      # ---------- 1. MSYS2 + build dependencies ----------
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-swig
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-libvpx
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-opencv
            mingw-w64-x86_64-python

      # ---------- 2. Python + PyQt6 + cx_Freeze ----------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 cx_Freeze
          $pyExe = (Get-Command python).Source
          $pyRoot = Split-Path $pyExe
          $pyVer = python -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')"
          "PY_EXE=$pyExe" >> $env:GITHUB_ENV
          "PY_ROOT=$pyRoot" >> $env:GITHUB_ENV
          "PY_INC=$pyRoot\include" >> $env:GITHUB_ENV
          "PY_LIB=$pyRoot\libs\python$pyVer.lib" >> $env:GITHUB_ENV

      # ---------- 3. Engine source ----------
      - name: Clone libopenshot-audio + libopenshot
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/OpenShot/libopenshot-audio.git
          git clone --depth 1 https://github.com/OpenShot/libopenshot.git
          # FFmpeg 7+ compat patch for libopenshot (AVCodec capability lists are private now)
          curl -sL "https://raw.githubusercontent.com/webnikal/eclipse-pro/main/patches/libopenshot-ffmpeg7.patch" -o /tmp/ffmpeg7.patch
          cd libopenshot
          git apply /tmp/ffmpeg7.patch
          cd ..

      # ---------- 4. Eclipse Pro source + patch ----------
      - name: Get Eclipse Pro source and apply patch
        shell: pwsh
        run: |
          git init eclipse-pro
          cd eclipse-pro
          git remote add origin https://github.com/OpenShot/openshot-qt.git
          git fetch --depth 1 origin 56584c7127568b66dd406cd6d82634e62601eaaf
          git checkout FETCH_HEAD
          # Eclipse changes patch (temporary link, expires ~48h after 2026-10-03)
          Invoke-WebRequest -Uri "https://muse.ai/files/1365194086677020/1838280244025204/ng97x84fwuqscg3qnpeksdz2/eclipse-changes.patch" -OutFile eclipse.patch
          git apply eclipse.patch
          git status --short | head -20

      # ---------- 5. Build libopenshot-audio ----------
      - name: Build libopenshot-audio
        shell: msys2 {0}
        run: |
          cd libopenshot-audio
          cmake -B build -S . -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-DJUCE_ASIO=0"
          cmake --build build -j $(nproc)
          cmake --install build --prefix /mingw64

      # ---------- 6. Build libopenshot (Python bindings -> setup-python) ----------
      - name: Build libopenshot
        shell: msys2 {0}
        run: |
          PY_ROOT_U=$(cygpath -u "$PY_ROOT")
          PY_INC_U=$(cygpath -u "$PY_INC")
          PY_LIB_U=$(cygpath -u "$PY_LIB")
          PY_EXE_U=$(cygpath -u "$PY_EXE")
          cd libopenshot
          cmake -B build -S . -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_QT6=ON \
            -DDISABLE_TESTS=1 \
            -DOpenShotAudio_ROOT="$PWD/../libopenshot-audio/build" \
            -DPYTHON_EXECUTABLE="$PY_EXE_U" \
            -DPYTHON_INCLUDE_DIR="$PY_INC_U" \
            -DPYTHON_INCLUDE_PATH="$PY_INC_U" \
            -DPYTHON_LIBRARY="$PY_LIB_U"
          cmake --build build -j $(nproc)
          cmake --install build --prefix "$PY_ROOT_U"

      - name: Stage DLLs next to Python module
        shell: msys2 {0}
        run: |
          PY_ROOT_U=$(cygpath -u "$PY_ROOT")
          cp /mingw64/bin/*.dll "$PY_ROOT_U"/python/ 2>/dev/null || true
          cp "$PY_ROOT_U"/bin/*.dll "$PY_ROOT_U"/python/ 2>/dev/null || true
          echo "--- ldd _openshot.pyd (missing DLLs if any) ---"
          ldd "$PY_ROOT_U"/python/_openshot.pyd | grep -i "not found" || echo "all DLL deps resolved"
          echo "--- _openshot.pyd diagnostics ---"
          ls -la "$PY_ROOT_U"/python/_openshot.pyd
          file "$PY_ROOT_U"/python/_openshot.pyd
          objdump -p "$PY_ROOT_U"/python/_openshot.pyd | grep "DLL Name:" | sort -u
          echo "--- recursive missing-DLL check (all staged DLLs) ---"
          missing=0
          for dll in "$PY_ROOT_U"/python/*.dll; do
            objdump -p "$dll" 2>/dev/null | grep "DLL Name:" | awk '{print $3}' | sort -u | while read -r dep; do
              dlower=$(echo "$dep" | tr 'A-Z' 'a-z')
              case "$dlower" in
                kernel32.dll|ntdll.dll|msvcrt.dll|user32.dll|gdi32.dll|advapi32.dll|shell32.dll|ole32.dll|oleaut32.dll|comdlg32.dll|comctl32.dll|ws2_32.dll|wsock32.dll|rpcrt4.dll|shlwapi.dll|version.dll|imm32.dll|setupapi.dll|dwmapi.dll|uxtheme.dll|bcrypt.dll|crypt32.dll|secur32.dll|netapi32.dll|wtsapi32.dll|d3d11.dll|dxgi.dll|opengl32.dll|winmm.dll|winspool.drv|lz32.dll|mpr.dll|cfgmgr32.dll|propsys.dll|powrprof.dll|devobj.dll|kernelbase.dll|msimg32.dll|dwrite.dll|d2d1.dll) continue;;
              esac
              if [ ! -f "$PY_ROOT_U/python/$dep" ]; then
                echo "MISSING: $dep (needed by $(basename $dll))"
              fi
            done
          done | sort -u | head -30
          echo "--- staged count ---"
          ls "$PY_ROOT_U"/python/*.dll | wc -l

      - name: Verify openshot import
        shell: pwsh
        run: |
          $env:PATH = "$env:PY_ROOT\bin;$env:RUNNER_TEMP\msys64\mingw64\bin;$env:PATH"
          $env:PYTHONPATH = "$env:PY_ROOT\python"
          python -c "import os; os.add_dll_directory(os.path.join(os.environ['PY_ROOT'], 'python')); os.add_dll_directory(os.path.join(os.environ['RUNNER_TEMP'], 'msys64', 'mingw64', 'bin')); import openshot; print('openshot OK:', openshot.__file__)"

      # ---------- 7. Freeze to exe ----------
      - name: Freeze EclipsePro.exe
        shell: pwsh
        run: |
          cd eclipse-pro
          $env:PATH = "$env:PY_ROOT\bin;$env:RUNNER_TEMP\msys64\mingw64\bin;$env:PATH"
          $env:PYTHONPATH = "$env:PY_ROOT\python"
          python -m cx_Freeze src/launch.py --target-dir dist --target-name EclipsePro --base console

      - name: Bundle DLLs
        shell: msys2 {0}
        run: |
          PY_ROOT_U=$(cygpath -u "$PY_ROOT")
          cp "$PY_ROOT_U"/bin/*.dll eclipse-pro/dist/ 2>/dev/null || true
          cp /mingw64/bin/*.dll eclipse-pro/dist/ 2>/dev/null || true
          ls eclipse-pro/dist | head -20

      # ---------- 8. Upload exe ----------
      - name: Upload EclipsePro
        uses: actions/upload-artifact@v4
        with:
          name: EclipsePro-windows
          path: eclipse-pro/dist/
