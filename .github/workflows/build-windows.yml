# Eclipse Pro — Windows exe builder (GitHub Actions)
#
# Kaise use karein:
# 1. Is file ko repo me .github/workflows/build-windows.yml path par add karo
#    (GitHub website -> Add file -> Create new file -> naam me poora path likho)
# 2. Actions tab -> "Build Eclipse Pro (Windows exe)" -> Run workflow dabao
# 3. Build khatam hone par neeche "Artifacts" me EclipsePro-windows download karo
#
# NOTE (v1): Pehli build me fail hona normal hai — log bhej dena, fix kar dunga.

name: Build Eclipse Pro (Windows exe)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      # ---------- 1. MSYS2 + build dependencies ----------
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-swig
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-libvpx
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-opencv
            mingw-w64-x86_64-python
            mingw-w64-x86_64-nsis

      # ---------- 2. Python + PyQt6 + cx_Freeze ----------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6==6.11.0 PyQt6-Qt6==6.11.2 PyQt6-sip==13.12.0 cx_Freeze==8.7.1 requests Pillow defusedxml
          $pyExe = (Get-Command python).Source
          $pyRoot = Split-Path $pyExe
          $pyVer = python -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')"
          "PY_EXE=$pyExe" >> $env:GITHUB_ENV
          "PY_ROOT=$pyRoot" >> $env:GITHUB_ENV
          "PY_INC=$pyRoot\include" >> $env:GITHUB_ENV
          "PY_LIB=$pyRoot\libs\python$pyVer.lib" >> $env:GITHUB_ENV

      # ---------- 3. Engine source ----------
      - name: Clone libopenshot-audio + libopenshot
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/OpenShot/libopenshot-audio.git
          # Eclipse Pro: pin libopenshot to a known-good commit (like openshot-qt).
          # --depth 1 latest pulled untested upstream code; pin for reproducible builds.
          git init libopenshot
          cd libopenshot
          git remote add origin https://github.com/OpenShot/libopenshot.git
          git fetch --depth 1 origin 0fbacca9d54a07982a2a000de5625d8526d45664
          git checkout FETCH_HEAD
          cd ..
          # FFmpeg 7+ compat patch for libopenshot (AVCodec capability lists are private now)
          curl -sL "https://raw.githubusercontent.com/webnikal/eclipse-pro/main/patches/libopenshot-ffmpeg7.patch" -o /tmp/ffmpeg7.patch
          cd libopenshot
          git apply /tmp/ffmpeg7.patch
          cd ..
          # Eclipse Pro: ABI-safe preview frame API (CopyPreviewFrame). The bundled
          # libopenshot is built with Qt5/MinGW while the app runs PyQt6, so passing
          # QWidgets across that boundary crashes (access violation in SetQWidget).
          # This patch adds raw-bytes frame polling instead - no Qt objects cross.
          curl -sL "https://raw.githubusercontent.com/webnikal/eclipse-pro/main/patches/libopenshot-preview-frame.patch" -o /tmp/previewframe.patch
          cd libopenshot
          git apply /tmp/previewframe.patch
          cd ..
          echo "AUDIO_SHA=$(cd libopenshot-audio && git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "LIBOPENSHOT_SHA=$(cd libopenshot && git rev-parse HEAD)" >> "$GITHUB_ENV"

      # ---------- 4. Eclipse Pro source + patch ----------
      - name: Get Eclipse Pro source and apply patch
        shell: pwsh
        run: |
          git init eclipse-pro
          cd eclipse-pro
          git remote add origin https://github.com/OpenShot/openshot-qt.git
          git fetch --depth 1 origin 56584c7127568b66dd406cd6d82634e62601eaaf
          git checkout FETCH_HEAD
          # Eclipse changes patch (temporary link, expires ~48h after 2026-10-03)
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/webnikal/eclipse-pro/main/patches/eclipse-changes.patch" -OutFile eclipse.patch
          git apply eclipse.patch
          # Eclipse splash animation (bundled via data-files step)
          # NOTE: we already did 'cd eclipse-pro' above, so path is relative to repo root
          New-Item -ItemType Directory -Force -Path "src/images" | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/webnikal/eclipse-pro/main/packaging/eclipse-splash.gif" -OutFile "src/images/eclipse-splash.gif"
          git status --short | head -20

      # ---------- 4b. Restore compiled C++ deps (cache) ----------
      # C++ compile (~5-7 min) is skipped on cache hit; Python/packaging fixes
      # then rebuild in ~3-4 min. Bump -vN if patches/libopenshot-ffmpeg7.patch or
      # patches/libopenshot-preview-frame.patch changes, or if the C++ build flags
      # change (v2: Qt5 instead of Qt6 for libopenshot; v3: preview frame API;
      # v7: restore public: after private section).
      - name: Restore compiled deps cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: deps
          key: eclipse-deps-${{ runner.os }}-${{ env.AUDIO_SHA }}-${{ env.LIBOPENSHOT_SHA }}-v8

      # ---------- 5. Build libopenshot-audio ----------
      - name: Build libopenshot-audio
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          DEPS_U=$(cygpath -u "$GITHUB_WORKSPACE")/deps
          cd libopenshot-audio
          cmake -B build -S . -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-DJUCE_ASIO=0"
          cmake --build build -j $(nproc)
          cmake --install build --prefix "$DEPS_U"

      # ---------- 6. Build libopenshot (Python bindings -> setup-python) ----------
      - name: Build libopenshot
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          DEPS_U=$(cygpath -u "$GITHUB_WORKSPACE")/deps
          PY_ROOT_U=$(cygpath -u "$PY_ROOT")
          PY_INC_U=$(cygpath -u "$PY_INC")
          PY_LIB_U=$(cygpath -u "$PY_LIB")
          PY_EXE_U=$(cygpath -u "$PY_EXE")
          cd libopenshot
          cmake -B build -S . -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_QT6=OFF \
            -DDISABLE_TESTS=1 \
            -DOpenShotAudio_ROOT="$PWD/../libopenshot-audio/build" \
            -DPYTHON_EXECUTABLE="$PY_EXE_U" \
            -DPYTHON_INCLUDE_DIR="$PY_INC_U" \
            -DPYTHON_INCLUDE_PATH="$PY_INC_U" \
            -DPYTHON_LIBRARY="$PY_LIB_U"
          cmake --build build -j $(nproc)
          cmake --install build --prefix "$DEPS_U"

      - name: Stage DLLs next to Python module
        shell: msys2 {0}
        run: |
          PY_ROOT_U=$(cygpath -u "$PY_ROOT")
          DEPS_U=$(cygpath -u "$GITHUB_WORKSPACE")/deps
          cp "$DEPS_U"/bin/*.dll "$DEPS_U"/python/ 2>/dev/null || true
          cp /mingw64/bin/*.dll "$DEPS_U"/python/ 2>/dev/null || true
          echo "--- ldd _openshot.pyd (missing DLLs if any) ---"
          ldd "$DEPS_U"/python/_openshot.pyd | grep -i "not found" || echo "all DLL deps resolved"
          echo "--- _openshot.pyd diagnostics ---"
          ls -la "$DEPS_U"/python/_openshot.pyd
          file "$DEPS_U"/python/_openshot.pyd
          objdump -p "$DEPS_U"/python/_openshot.pyd | grep "DLL Name:" | sort -u
          echo "--- recursive missing-DLL check (staged + System32) ---"
          for dll in "$DEPS_U"/python/*.dll; do
            objdump -p "$dll" 2>/dev/null | grep "DLL Name:" | awk '{print $3}' | sort -u | while read -r dep; do
              if [ ! -f "$DEPS_U/python/$dep" ] && [ ! -f "/c/Windows/System32/$dep" ]; then
                echo "REAL-MISSING: $dep (needed by $(basename $dll))"
              fi
            done
          done | sort -u | head -20
          echo "--- staged count ---"
          ls "$DEPS_U"/python/*.dll | wc -l

          echo "=== DLL names in pyd import table (hidden chars shown) ==="
          objdump -p "$DEPS_U"/python/_openshot.pyd | grep "DLL Name:" | cat -A
          echo "=== libopenshot.dll internal name (hidden chars shown) ==="
          objdump -p "$DEPS_U"/python/libopenshot.dll | grep -m1 -A1 "Export Table" | cat -A
          echo "=== staged filenames (hidden chars shown) ==="
          ls "$DEPS_U"/python/ | grep -i "openshot\|jsoncpp" | cat -A
          echo "=== pyopenshot link command ==="
          echo "=== pefile strict PE validation ==="
          "$PY_ROOT_U"/python.exe -m pip install -q pefile 2>&1 | tail -1
          "$PY_ROOT_U"/python.exe - <<'PYEOF2'
          import pefile, os
          import os as _os
          pyd = _os.path.join(_os.environ['GITHUB_WORKSPACE'], 'deps', 'python', '_openshot.pyd')
          try:
              pe = pefile.PE(pyd)
              print('PE parse OK, sections:', len(pe.sections))
              print('import descriptors:', len(pe.DIRECTORY_ENTRY_IMPORT))
              for e in pe.DIRECTORY_ENTRY_IMPORT:
                  dll = e.dll.decode(errors='replace')
                  print('  IMPORT-DLL:', repr(dll))
          except Exception as ex:
              print('PEFILE-FAIL:', ex)
          PYEOF2
          RTU=$(cygpath -u "$RUNNER_TEMP")
          find "$RTU" -name "link.txt" -path "*pyopenshot*" 2>/dev/null | head -2 | while read -r f; do echo "--- $f"; tr ' ' '\n' < "$f" | grep -i "dll\|libopenshot" | head -20; done

      - name: Verify openshot import
        shell: pwsh
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\deps\python;$env:GITHUB_WORKSPACE\deps\bin;$env:PY_ROOT;$env:PY_ROOT\bin;$env:RUNNER_TEMP\msys64\mingw64\bin;$env:PATH"
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\\deps\\python"
          & $env:PY_EXE -c "import sys; print('python:', sys.version)"
          & $env:PY_EXE -c "import openshot; print('openshot OK:', openshot.__file__)"
      - name: Pinpoint failing DLL
        if: failure()
        shell: pwsh
        run: |
          $py = @'
          import os, ctypes
          d = os.path.join(os.environ['GITHUB_WORKSPACE'], 'deps', 'python')
          for x in ['libgcc_s_seh-1.dll','libwinpthread-1.dll','libstdc++-6.dll','libjsoncpp-27.dll','libopenshot-audio.dll','Qt6Core.dll','Qt6Gui.dll','libopenshot.dll']:
              p = os.path.join(d, x)
              try:
                  ctypes.WinDLL(p)
                  print('LOAD-OK:', x)
              except Exception as e:
                  print('LOAD-FAIL:', x, '->', e)
          '@
          $py | Out-File -Encoding ascii "$env:RUNNER_TEMP\pinpoint.py"
          python "$env:RUNNER_TEMP\pinpoint.py"

      # ---------- 7. Freeze to exe ----------
      - name: Freeze EclipsePro.exe
        shell: pwsh
        run: |
          cd eclipse-pro
          $env:PATH = "$env:GITHUB_WORKSPACE\\deps\\bin;$env:PY_ROOT;$env:PY_ROOT\\bin;$env:RUNNER_TEMP\\msys64\\mingw64\\bin;$env:PATH"
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\\deps\\python"
          & $env:PY_EXE -m cx_Freeze --script src/launch.py --target-dir dist --target-name EclipsePro --base console

      # ---------- 7b. Diagnostic freeze test (Qt5+Qt6 load order) ----------
      # Minimal console exe: prints exactly where the frozen app dies.
      # Mandeep Singh runs this on his PC and sends the console output.
      - name: Freeze diagnostic test exe
        shell: pwsh
        run: |
          cd eclipse-pro
          @'
          import sys, os
          import faulthandler
          faulthandler.enable()
          print("DIAG-START", flush=True)
          _base = os.path.dirname(os.path.abspath(__file__))
          sys.path.insert(0, os.path.join(_base, "app_src"))
          print("DIAG-USING: bundled app_src", flush=True)
          try:
              from PyQt6 import QtCore, QtWidgets
              print("DIAG-PYQT6-OK", flush=True)
          except Exception as e:
              print("DIAG-PYQT6-FAIL:", e, flush=True)
          try:
              import openshot
              print("DIAG-OPENSHOT-OK", flush=True)
          except Exception as e:
              print("DIAG-OPENSHOT-FAIL:", e, flush=True)
          try:
              from classes.app import OpenShotApp
              print("DIAG-OPENSHOTAPP-OK", flush=True)
          except Exception as e:
              print("DIAG-OPENSHOTAPP-FAIL:", type(e).__name__, e, flush=True)
          try:
              qapp = OpenShotApp([])
              print("DIAG-APP-CREATED", flush=True)
          except Exception as e:
              print("DIAG-APP-CREATE-FAIL:", type(e).__name__, e, flush=True)
              import traceback; traceback.print_exc()
          try:
              print("DIAG-CALLING-GUI", flush=True)
              qapp.gui()
              print("DIAG-GUI-RETURNED", flush=True)
          except Exception as e:
              print("DIAG-GUI-FAIL:", type(e).__name__, e, flush=True)
              import traceback; traceback.print_exc()
          print("DIAG-DONE", flush=True)
          '@ | Out-File -Encoding utf8 diag_test.py
          $env:PATH = "$env:GITHUB_WORKSPACE\\deps\\bin;$env:PY_ROOT;$env:PY_ROOT\\bin;$env:RUNNER_TEMP\\msys64\\mingw64\\bin;$env:PATH"
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\\deps\\python"
          & $env:PY_EXE -m cx_Freeze --script diag_test.py --target-dir dist-diag --target-name DiagTest --base console
          # Bundle src for imports + data files where the app expects them (lib/)
          Copy-Item -Recurse -Force "src" "dist-diag/app_src"
          foreach ($d in @("settings","language","resources","profiles","images","presets","colors","transitions","effects","emojis","titles","themes")) {
            if (Test-Path "src/$d") {
              New-Item -ItemType Directory -Force -Path "dist-diag/lib/$d" | Out-Null
              Copy-Item -Recurse -Force "src/$d/*" "dist-diag/lib/$d/"
            }
          }

      # ---------- 7a. Bundle app data files ----------
      # cx_Freeze only bundles .py files; copy data dirs (settings, language, etc.)
      - name: Bundle app data files
        shell: msys2 {0}
        run: |
          for d in settings language resources profiles images presets colors transitions effects emojis titles themes blender comfyui; do
            mkdir -p "eclipse-pro/dist/lib/$d"
            cp -r "eclipse-pro/src/$d/"* "eclipse-pro/dist/lib/$d/" 2>/dev/null || true
            echo "$d: $(ls "eclipse-pro/dist/lib/$d" | wc -l) files staged"
          done

      # ---------- 7b. Force PyQt6's official Qt6 DLLs ----------
      # cx_Freeze sometimes bundles MinGW's Qt6 (found via PATH) instead of
      # PyQt6's own -> "specified procedure could not be found" at startup.
      # Remove any Qt6 DLLs cx_Freeze picked up, install PyQt6's official ones.
      - name: Fix Qt DLLs (use PyQt6 official Qt6)
        shell: pwsh
        run: |
          $qtBin = "$env:PY_ROOT\Lib\site-packages\PyQt6\Qt6\bin"
          if (-not (Test-Path "$qtBin\Qt6Core.dll")) { throw "PyQt6 Qt bin not found: $qtBin" }
          $dist = "$env:GITHUB_WORKSPACE\eclipse-pro\dist"
          Write-Host "Removing Qt6 DLLs bundled by cx_Freeze (may be MinGW's)..."
          Get-ChildItem $dist -Recurse -Filter "Qt6*.dll" | ForEach-Object { Write-Host "  removing $($_.Name)"; Remove-Item $_.FullName -Force }
          Write-Host "Installing PyQt6 official Qt6 DLLs..."
          Copy-Item "$qtBin\*.dll" $dist -Force
          Get-ChildItem "$dist\Qt6Core.dll" | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Bundle DLLs
        shell: msys2 {0}
        run: |
          PY_ROOT_U=$(cygpath -u "$PY_ROOT")
          DEPS_U=$(cygpath -u "$GITHUB_WORKSPACE")/deps
          for f in "$DEPS_U"/bin/*.dll; do
            case "$(basename "$f")" in Qt6*.dll) continue;; *) cp "$f" eclipse-pro/dist/ 2>/dev/null || true;; esac
          done
          # NOTE: exclude Qt6*.dll from manual bundling - cx_Freeze already bundles
          # PyQt6's official Qt DLLs; MinGW's Qt6 DLLs would shadow them and cause
          # "procedure not found" (wrong Qt version loaded for PyQt6)
          for f in "$PY_ROOT_U"/bin/*.dll; do
            case "$(basename "$f")" in Qt6*.dll) continue;; *) cp "$f" eclipse-pro/dist/ 2>/dev/null || true;; esac
          done
          for f in /mingw64/bin/*.dll; do
            case "$(basename "$f")" in Qt6*.dll) continue;; *) cp "$f" eclipse-pro/dist/ 2>/dev/null || true;; esac
          done
          ls eclipse-pro/dist | head -20

      # ---------- 8. Build NSIS installer ----------
      - name: Build installer
        shell: pwsh
        run: |
          # Repo files are not checked out on runner; fetch .nsi like the ffmpeg patch
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/webnikal/eclipse-pro/main/packaging/eclipse-pro.nsi" -OutFile "$env:RUNNER_TEMP\\eclipse-pro.nsi"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/webnikal/eclipse-pro/main/packaging/eclipse-pro.ico" -OutFile "$env:RUNNER_TEMP\\eclipse-pro.ico"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/webnikal/eclipse-pro/main/packaging/eclipse-header.bmp" -OutFile "$env:RUNNER_TEMP\\eclipse-header.bmp"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/webnikal/eclipse-pro/main/packaging/eclipse-wizard.bmp" -OutFile "$env:RUNNER_TEMP\\eclipse-wizard.bmp"
          & "$env:RUNNER_TEMP\\msys64\\mingw64\\bin\\makensis.exe" "/DDISTDIR=$env:GITHUB_WORKSPACE\\eclipse-pro\\dist" "/DOUTFILE=$env:GITHUB_WORKSPACE\\EclipsePro-Setup.exe" "/DICONFILE=$env:RUNNER_TEMP\\eclipse-pro.ico" "/DHEADERBMP=$env:RUNNER_TEMP\\eclipse-header.bmp" "/DWIZARDBMP=$env:RUNNER_TEMP\\eclipse-wizard.bmp" "$env:RUNNER_TEMP\\eclipse-pro.nsi"
          Get-Item "$env:GITHUB_WORKSPACE\\EclipsePro-Setup.exe" | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      # ---------- 9. Upload exe ----------
      - name: Upload EclipsePro
        uses: actions/upload-artifact@v4
        with:
          name: EclipsePro-windows
          path: eclipse-pro/dist/

      - name: Upload diagnostic test exe
        uses: actions/upload-artifact@v4
        with:
          name: EclipsePro-DiagTest
          path: eclipse-pro/dist-diag/

      - name: Upload EclipsePro Setup
        uses: actions/upload-artifact@v4
        with:
          name: EclipsePro-Setup
          path: EclipsePro-Setup.exe
